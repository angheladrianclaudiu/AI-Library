<script>
  // Apply the stored theme before first paint so there is no flash of the
  // wrong colour scheme. Kept inline and tiny on purpose.
  (function () {
    try {
      var t = localStorage.getItem("ail-theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <a class="topbar__home" href="index.html">
    <span class="topbar__mark" aria-hidden="true">AI</span>
    <span>AI Library</span>
  </a>
  <span class="topbar__spacer"></span>
  <button class="theme-toggle" type="button" aria-label="Toggle dark and light theme">
    <span class="icon-light" aria-hidden="true">☾</span>
    <span class="icon-dark" aria-hidden="true">☀</span>
  </button>
</header>

<main id="main">
  <div class="wrap">

    <div class="lib-hero">
      <p class="eyebrow">Papers &amp; articles, explained</p>
      <h1>AI Library</h1>
      <p>Research papers and long-form articles about AI, each read end to end and rewritten
         in plain English, with the figures that actually explain the idea.</p>
      <p class="lib-count" id="count"></p>
    </div>

    <div class="controls">
      <div class="controls__row">
        <label class="search">
          <span class="visually-hidden">Search the library</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
          </svg>
          <input id="search" type="search" placeholder="Search by title, author, tag…" autocomplete="off">
        </label>
        <label class="visually-hidden" for="sort">Sort by</label>
        <select class="sort" id="sort">
          <option value="added">Recently added</option>
          <option value="year">Publication year</option>
          <option value="read">Longest read</option>
          <option value="title">Title A–Z</option>
        </select>
      </div>
      <div class="tagbar" id="tagbar"></div>
    </div>

    <ul class="cards" id="cards"></ul>

  </div>
</main>
