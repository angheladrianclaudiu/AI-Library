<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — AI Library</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#129504;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<script>
  (function () {
    try {
      var t = localStorage.getItem("ail-theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
</head>
<body>

<div id="progress"></div>
<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <a class="topbar__home" href="../index.html">
    <span class="topbar__mark" aria-hidden="true">AI</span>
    <span>AI Library</span>
  </a>
  <span class="topbar__crumb">{{TITLE}}</span>
  <span class="topbar__spacer"></span>
  <button class="theme-toggle" type="button" aria-label="Toggle dark and light theme">
    <span class="icon-light" aria-hidden="true">☾</span>
    <span class="icon-dark" aria-hidden="true">☀</span>
  </button>
</header>

<main id="main" class="doc">

  <div class="hero">
    <p class="hero__kicker">
      <span class="badge badge--{{TYPE}}">{{TYPE_LABEL}}</span>
    </p>
    <h1>{{TITLE}}</h1>
    {{AUTHORS_BLOCK}}
    <p class="hero__meta">{{META}}</p>
    <p class="srclinks">{{SOURCE_LINKS}}</p>
  </div>

  <div class="tldr">
    <h2>In short</h2>
    {{TLDR}}
  </div>

  <details class="toc" open>
    <summary>Contents</summary>
    <ol>
{{TOC}}
    </ol>
  </details>

{{SECTIONS}}

  <footer class="colophon">
    {{COLOPHON_LEAD}}
    {{COLOPHON_NOTE}}
    <p><a href="../index.html">← Back to the library</a></p>
  </footer>

</main>

<script src="../assets/app.js"></script>
{{EXTRA_SCRIPTS}}

</body>
</html>
